<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16181D">
  <title>MKA Site Visit Buddy</title>
  <link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/app-icon.svg"><link rel="apple-touch-icon" href="/static/app-icon.svg">
  <style>
    :root{font:16px/1.5 Geist,Inter,system-ui,-apple-system,sans-serif;color:#16181d;background:#f5f5f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f5f3}header,main{width:100%;max-width:390px;margin:auto}header{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}main{padding:18px 16px 50px}h1{font-size:16px;margin:0;font-weight:650}h2{font-size:30px;line-height:1.08;letter-spacing:-.035em;margin:12px 0 5px}.muted{color:#5f636b;font-size:13px}.bar,.card{background:#fff;border:1px solid #e8e8e4;border-radius:16px}.bar{display:grid;gap:10px;margin:22px 0;padding:14px}.bar input{width:100%}input,button{font:inherit;min-height:44px;border:1px solid #d6d6d1}input{border-radius:11px;background:#fff;padding:10px 12px;outline:none}input:focus{border-color:#777a80;box-shadow:0 0 0 3px #16181d0d}button{border-radius:999px;background:#16181d;color:#fff;padding:0 17px;font-weight:650;cursor:pointer}button:disabled{cursor:wait;opacity:.55}header button,.danger{background:#fff;color:#16181d;border-color:#d6d6d1}.projects{display:grid;gap:10px}.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:16px}.card h3{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card>.danger{font-size:12px;padding:0 13px}.visits{grid-column:1/-1;margin-top:8px;font-size:13px}.visits>strong{color:#5f636b}.visits>button{float:right;min-height:36px;background:#fff;color:#16181d;font-size:12px}.visit{padding:13px 0;border-top:1px solid #eeeeea}.visit:first-of-type{margin-top:12px}.visit a,a{color:#16181d;text-decoration-color:#aaa}.error{color:#9f2f0b;font-size:13px;min-height:20px}main>p a{display:inline-flex;min-height:44px;align-items:center;border:1px solid #d6d6d1;border-radius:999px;padding:0 14px;text-decoration:none;background:#fff}@media(min-width:700px){body{padding-top:24px}header,main{border-left:1px solid #e8e8e4;border-right:1px solid #e8e8e4}}
  </style>
</head>
<body>
<header>
  <h1>MKA Site Visit Buddy</h1>
  <form method="post" action="/auth/logout"><button class="danger">Sign out</button></form>
</header>
<main>
  <h2>Projects</h2>
  <div class="muted">{{ user.email }} &middot; {{ user.role }}</div>
  {% if user.role == "admin" %}<p><a href="/admin">Admin settings</a></p>{% endif %}
  <form class="bar" id="new-project">
    <input name="name" maxlength="300" required placeholder="Project name">
    <input name="project_number" maxlength="100" placeholder="Project number">
    <input name="visit_date" type="date" required aria-label="First visit date">
    <button id="create-project">Create &amp; start visit</button>
  </form>
  <p id="message" class="error" role="alert"></p>
  <section id="projects" class="projects" aria-live="polite"></section>
</main>
<script>
const list=document.querySelector("#projects"), message=document.querySelector("#message");
async function api(url,options={}) {
  const response=await fetch(url,{headers:{"Content-Type":"application/json"},...options});
  if(response.status===204)return null;
  const body=await response.json();
  if(!response.ok)throw new Error(body.error||"Request failed");
  return body;
}
function safe(value){const node=document.createElement("span");node.textContent=value||"";return node.innerHTML}
async function load(){
  try{
    const projects=await api("/api/projects"); list.innerHTML="";
    for(const project of projects){
      const card=document.createElement("article");card.className="card";
      card.innerHTML="<div><h3>"+safe(project.name)+"</h3><div class=muted>"+
        safe(project.project_number||"No project number")+"</div></div>"+
        "<button class=danger data-archive>Archive</button><div class=visits>Loading visits...</div>";
      card.querySelector("[data-archive]").onclick=async()=>{await api("/api/projects/"+project.id,{method:"DELETE"});load()};
      list.append(card);
      const visits=await api("/api/projects/"+project.id+"/visits");
      const box=card.querySelector(".visits");
      box.innerHTML="<strong>Visits</strong> <button data-add-visit>Add visit</button> "+
        (visits.length?"":"<span class=muted>None yet</span>");
      box.querySelector("[data-add-visit]").onclick=async()=>{
        const date=prompt("Visit date (YYYY-MM-DD)",new Date().toISOString().slice(0,10));
        if(!date)return;
        await api("/api/projects/"+project.id+"/visits",{
          method:"POST",body:JSON.stringify({visit_date:date})
        });load();
      };
      visits.forEach(v=>{const row=document.createElement("div");row.className="visit";
        row.innerHTML="<a href=/visits/"+v.id+"/overview>"+safe(v.visit_date)+
          (v.report_number?" - "+safe(v.report_number):"")+"</a>";box.append(row)});
    }
  }catch(error){message.textContent=error.message}
}
const projectForm=document.querySelector("#new-project"), createButton=document.querySelector("#create-project");
projectForm.elements.visit_date.value=new Date().toISOString().slice(0,10);
let creatingProject=false;
projectForm.onsubmit=async event=>{
  event.preventDefault();message.textContent="";
  if(creatingProject)return;
  creatingProject=true;createButton.disabled=true;createButton.textContent="Creating...";
  const form=new FormData(event.target);
  try{
    const project=await api("/api/projects",{method:"POST",body:JSON.stringify(Object.fromEntries(form))});
    location.assign("/visits/"+project.initial_visit.id+"/overview");
  }catch(error){
    message.textContent=error.message;creatingProject=false;createButton.disabled=false;
    createButton.textContent="Create & start visit";
  }
};
load();
</script>
<script src="/static/cloud_pwa.js"></script>
</body>
</html>
