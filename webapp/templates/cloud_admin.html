<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16181D"><title>Admin settings - MKA Site Visit Buddy</title><link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/app-icon.svg"><style>:root{font:16px/1.5 Inter,system-ui;color:#16181d;background:#f5f5f3}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:30px 18px}a{color:#16181d}.card{background:#fff;border:1px solid #e8e8e4;border-radius:16px;padding:22px;margin:20px 0}h1{font-size:28px;margin:20px 0 4px}.muted{color:#5f636b;font-size:14px}label{display:block;font-weight:650;margin-bottom:8px}input{width:100%;min-height:44px;border:1px solid #d6d6d1;border-radius:10px;padding:10px}button{min-height:48px;border:0;border-radius:999px;background:#16181d;color:#fff;padding:0 24px;font-weight:650;cursor:pointer}.status{font-size:14px;min-height:22px}.error{color:#9f2f0b}.badge{display:inline-block;border:1px solid #d6d6d1;border-radius:999px;padding:3px 9px;font-size:12px;margin-left:6px}</style></head><body><main><a href="/">&larr; Projects</a><h1>Admin settings</h1><p class="muted">Private workspace configuration. Report instructions and the MKA Word template are versioned with the application.</p><form class="card" id="settings"><label for="api-key">Claude API key <span class="badge" id="secret-status">Checking...</span></label><input id="api-key" name="api_key" type="password" autocomplete="off" placeholder="sk-ant-..."><p class="muted">Encrypted before private cloud storage. Enter a value only when setting or replacing the current key.</p><button id="save">Save API key</button><p class="status" id="message" role="status"></p></form></main><script>
const form=document.querySelector("#settings"),message=document.querySelector("#message");async function decode(response){const text=await response.text();let data;try{data=JSON.parse(text)}catch(_error){throw new Error(response.status===401?"Your session expired. Sign in again.":"Server returned an unexpected response ("+response.status+"). Check the Render logs.")}if(!response.ok)throw new Error(data.error||"Request failed");return data}async function status(){const data=await decode(await fetch("/api/admin/settings"));document.querySelector("#secret-status").textContent=data.secret?"Configured":"Not set"}form.onsubmit=async event=>{event.preventDefault();const button=document.querySelector("#save");button.disabled=true;message.className="status";message.textContent="Saving...";try{const data=await decode(await fetch("/api/admin/settings",{method:"POST",body:new FormData(form)}));message.textContent=data.message;form.reset();await status()}catch(error){message.className="status error";message.textContent=error.message}finally{button.disabled=false}};status().catch(error=>{message.className="status error";message.textContent=error.message});
</script><script src="/static/cloud_pwa.js"></script></body></html>
