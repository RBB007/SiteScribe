<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SiteScribe</title>
<style>
:root{
  --bg:#fff;--fg:#14181d;--mut:#667085;--line:#e4e7ec;--card:#f9fafb;--card2:#f2f4f7;
  --accent:#1554b8;--accent-fg:#fff;--ok:#067647;--bad:#b42318;--warn:#b54708;
  --info:#5b6b7c;--minor:#2e7d32;--major:#b54708;--critical:#b42318;--safety:#6941c6;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1216;--fg:#e8eaed;--mut:#98a2b3;--line:#262c33;--card:#161a1f;--card2:#1d2227;
  --accent:#4d8df0;--accent-fg:#06101f;--ok:#5fd09a;--bad:#ff8a80;--warn:#f5b26b;
  --info:#8fa0b0;--minor:#5fd09a;--major:#f5b26b;--critical:#ff8a80;--safety:#c3a6ff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:0 14px calc(90px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 0 12px;border-bottom:1px solid var(--line)}
.back{flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;
  border-radius:9px;background:var(--card2);border:1px solid var(--line);
  color:var(--fg);text-decoration:none;font-size:24px;line-height:1}
.projName{font-weight:700;font-size:17px;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mut);font-size:12.5px}
button{font:inherit;border:0;border-radius:9px;background:var(--accent);
  color:var(--accent-fg);padding:11px 14px;font-weight:600;cursor:pointer}
button.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
button.ghost:disabled{opacity:.35}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
button.wide{width:100%}
button.sm{padding:9px 11px;font-size:13px}
.tplBar{display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:10px;
  font-size:12.5px;color:var(--mut)}
.tplBar b{color:var(--fg);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tplBar .x{margin-left:auto;background:transparent;border:0;color:var(--bad);
  font-size:17px;padding:3px 7px;cursor:pointer;flex:0 0 auto}
.nav{display:flex;align-items:center;gap:10px;margin:14px 0 0}
.nav button{min-width:56px;font-size:20px;line-height:1;padding:12px 0;flex:0 0 auto}
.nav .label{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.nav .label small{display:block;font-weight:500;font-size:11px;color:var(--mut);
  letter-spacing:.08em;text-transform:uppercase}
.nav.item button{background:var(--accent);color:var(--accent-fg)}
.nav.photo{margin-top:8px}
.nav.photo button{background:var(--card2);color:var(--fg);border:1px solid var(--line);
  font-size:15px;min-width:46px;padding:8px 0}
.nav.photo .label{font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px;margin-top:12px}
.card h2{margin:0 0 9px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mut);font-weight:700}
.photoBox{position:relative;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;margin-top:10px;overflow:hidden;min-height:200px;
  display:flex;align-items:center;justify-content:center}
.photoBox img{width:100%;display:block}
.empty{text-align:center;padding:34px 18px;color:var(--mut)}
.empty p{margin:0 0 12px;font-size:14px}
input[type=file]{display:none}
textarea,input[type=text],select{width:100%;padding:11px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:86px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--mut);font-size:13.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{color:#fff;border-color:transparent}
.chip[data-v=Info][aria-pressed=true]{background:var(--info)}
.chip[data-v=Minor][aria-pressed=true]{background:var(--minor)}
.chip[data-v=Major][aria-pressed=true]{background:var(--major)}
.chip[data-v=Critical][aria-pressed=true]{background:var(--critical)}
.chip[data-v=Safety][aria-pressed=true]{background:var(--safety)}
.inc{display:flex;align-items:center;gap:11px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-top:12px}
.inc .t{flex:1;font-size:14px;font-weight:600}
.inc .t small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.sw{position:relative;width:50px;height:30px;flex:0 0 auto}
.sw input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);
  transition:.15s;pointer-events:none}
.sw span::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;
  background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(20px)}
.msg{font-size:12.5px;color:var(--mut);margin-top:8px;min-height:16px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}
.row{display:flex;gap:9px}.row>*{flex:1}
.loc{display:flex;align-items:center;gap:11px}
.loc canvas{width:76px;height:76px;object-fit:cover;border-radius:9px;
  border:1px solid var(--line);flex:0 0 auto;background:var(--card2)}
.loc .d{flex:1;font-size:13px;color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
  border-top:1px solid var(--line);padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  display:flex;gap:9px;z-index:40}
.bar .wrap{display:flex;gap:9px;width:100%;max-width:560px;margin:0 auto}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--fg);
  max-width:94vw;width:620px}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dlgHead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 15px;border-bottom:1px solid var(--line)}
.dlgHead b{font-size:15px}
.dlgBody{padding:15px;max-height:72vh;overflow:auto}
#planHolder{position:relative;touch-action:manipulation}
#planCanvas{width:100%;display:block;border:1px solid var(--line);border-radius:9px}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -13px;pointer-events:none}
.tx{display:flex;gap:9px;align-items:flex-start;margin-top:10px;
  font-size:12.5px;color:var(--mut);cursor:pointer}
.tx input{margin:2px 0 0;flex:0 0 auto;width:17px;height:17px;accent-color:var(--accent)}
.clip{display:flex;align-items:center;gap:9px;background:var(--card2);
  border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:9px}
.clip audio{flex:1;min-width:0;height:34px}
.clip .id{font-size:11px;color:var(--mut);font-weight:700;flex:0 0 auto}
.clip button{background:transparent;color:var(--bad);border:0;padding:4px 7px;
  font-size:17px;line-height:1;flex:0 0 auto}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  font-weight:700;color:#fff}
</style>
</head>
<body>
<div class="wrap">

<header>
  <a class="back" href="/" title="All reports">&lsaquo;</a>
  <div style="flex:1;min-width:0">
    <div class="projName" id="projName">&nbsp;</div>
    <div class="sub" id="visitSub">Loading…</div>
  </div>
  <div style="display:flex;gap:7px;flex:0 0 auto">
    <button class="ghost sm" id="btnPlans">Plans</button>
    <button class="ghost sm" id="btnTemplate">Template</button>
  </div>
</header>

<!-- ITEM NAVIGATOR (bold triangles in the sketch) -->
<div class="nav item">
  <button id="itemPrev" aria-label="Previous item">&#9664;</button>
  <div class="label" id="itemLabel"><small>Item</small>—</div>
  <button id="itemNext" aria-label="Next item">&#9654;</button>
</div>

<!-- IMAGE -->
<div class="photoBox" id="photoBox"></div>

<!-- PHOTO NAVIGATOR (thin arrows in the sketch) -->
<div class="nav photo">
  <button id="photoPrev" aria-label="Previous photo">&#8592;</button>
  <div class="label" id="photoLabel">No photos</div>
  <button id="photoNext" aria-label="Next photo">&#8594;</button>
</div>
<div class="row" style="margin-top:8px">
  <button class="ghost" id="btnAddPhoto">+ Photo</button>
  <button class="danger" id="btnDelPhoto">Delete photo</button>
</div>
<input type="file" accept="image/*" id="photoInput">
<input type="file" accept="application/pdf,image/*" id="planInput">
<input type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" id="tplInput">

<!-- INCLUDE -->
<div class="inc">
  <div class="t">Include in report
    <small id="incHint">This item will appear in the Word report</small></div>
  <label class="sw"><input type="checkbox" id="include" checked><span></span></label>
</div>

<!-- LOCATION -->
<div class="card">
  <h2>Location on plan <span style="text-transform:none;letter-spacing:0">(optional)</span></h2>
  <div id="locBody"></div>
</div>

<!-- DESCRIPTION -->
<div class="card">
  <h2>Description</h2>
  <textarea id="desc" placeholder="Describe the observation — or record a voice note and it will be transcribed here."></textarea>
  <div class="row" style="margin-top:9px">
    <button id="btnDictate">&#127908; Dictate</button>
    <button class="ghost" id="btnRec">● Record audio</button>
  </div>
  <label class="tx"><input type="checkbox" id="txToggle">
    <span>Transcribe recordings to text (needs an API key — off = keep audio only)</span></label>
  <div id="clips"></div>
  <div class="msg" id="recMsg"></div>
</div>

<!-- IMPORTANCE -->
<div class="card">
  <h2>Importance</h2>
  <div class="chips" id="impChips"></div>
</div>

<!-- TAGS -->
<div class="card">
  <h2>Tags</h2>
  <input type="text" id="tags" placeholder="comma, separated, tags">
</div>

<div id="tplBar"></div>
<div class="msg" id="status"></div>
</div>

<div class="bar"><div class="wrap">
  <button id="btnNewItem" style="flex:2">+ New item</button>
  <button class="ghost" id="btnExport" style="flex:1">Export</button>
</div></div>

<dialog id="planDlg">
  <div class="dlgHead">
    <b>Tap the location</b>
    <div style="display:flex;gap:8px">
      <button class="ghost" id="planClear">Clear</button>
      <button id="planDone">Done</button>
    </div>
  </div>
  <div class="dlgBody">
    <select id="planSelect" style="margin-bottom:10px"></select>
    <div id="planHolder">
      <canvas id="planCanvas"></canvas>
      <div class="pin" id="planPin" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26">
          <path d="M12 0C7 0 3 4 3 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z" fill="#e5484d"/>
          <circle cx="12" cy="9" r="3.4" fill="#fff"/></svg>
      </div>
    </div>
    <div class="msg" id="planMsg">Upload a plan from “Plans”, then tap where this item is.</div>
  </div>
</dialog>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

const $ = id => document.getElementById(id);
const IMPORTANCE = ["Info","Minor","Major","Critical","Safety"];

let items = [], plans = [], ii = 0, pi = 0;
let pendingLoc = null, planDoc = null, planImg = null;

const item  = () => items[ii] || null;
const photo = () => { const it = item(); return it && it.photos[pi] || null; };

async function api(path, opts={}){
  const res = await fetch(path, opts);
  if (res.status === 401) { location.href = "/login"; throw new Error("unauthorized"); }
  if (res.status === 409) { location.href = "/"; throw new Error("no project open"); }
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}
const say = (t, c="") => { $('status').className = "msg " + c; $('status').textContent = t; };

/* ---------------- load ---------------- */
async function load(){
  api('/api/projects').then(r => {
    const p = r.projects.find(x => x.project_id === r.current);
    $('projName').textContent = p ? p.name : "SiteScribe";
    document.title = p ? `${p.name} — SiteScribe` : "SiteScribe";
  }).catch(()=>{});
  loadTemplate();
  const d = await api('/api/visit');
  items = d.items; plans = d.plans;
  if (ii >= items.length) ii = Math.max(0, items.length - 1);
  render();
}

/* ---------------- render ---------------- */
function render(){
  const it = item();
  $('visitSub').textContent =
    `${items.length} item${items.length===1?"":"s"} · ${items.filter(x=>x.include).length} in report`;

  $('itemLabel').innerHTML = it
    ? `<small>Item</small>${it.item_id}  <span style="color:var(--mut);font-weight:500">${ii+1}/${items.length}</span>`
    : `<small>Item</small>—`;
  $('itemPrev').disabled = ii <= 0;
  $('itemNext').disabled = ii >= items.length - 1;

  if (!it){
    $('photoBox').innerHTML =
      `<div class="empty"><p>No items yet.</p><button id="first">+ New item</button></div>`;
    $('first').onclick = newItem;
    $('photoLabel').textContent = "No photos";
    $('locBody').innerHTML = "";
    return;
  }

  /* photo */
  const ph = photo();
  if (ph){
    $('photoBox').innerHTML = `<img src="${ph.url}" alt="">`;
  } else {
    $('photoBox').innerHTML =
      `<div class="empty"><p>No photo for ${it.item_id}</p>
       <button id="shoot">Take / choose photo</button></div>`;
    $('shoot').onclick = () => $('photoInput').click();
  }
  const n = it.photos.length;
  $('photoLabel').textContent = n ? `Photo ${pi+1} / ${n}` : "No photos";
  $('photoPrev').disabled = pi <= 0;
  $('photoNext').disabled = pi >= n - 1;
  $('btnDelPhoto').disabled = !ph;

  /* fields */
  $('include').checked = it.include;
  $('incHint').textContent = it.include
    ? "This item will appear in the Word report"
    : "Excluded — will NOT appear in the report";
  $('desc').value = it.description || "";
  $('tags').value = (it.tags || []).join(", ");

  $('impChips').innerHTML = IMPORTANCE.map(v =>
    `<button class="chip" data-v="${v}" aria-pressed="${it.importance===v}">${v}</button>`).join("");
  [...$('impChips').children].forEach(b =>
    b.onclick = () => patch({importance: b.dataset.v}));

  /* location */
  if (it.location){
    const p = plans.find(x => x.plan_id === it.location.plan_id);
    $('locBody').innerHTML =
      `<div class="loc"><canvas id="locThumb" width="76" height="76"></canvas>
       <div class="d"><b>${p ? p.name : "plan"}</b><br>page ${it.location.page} ·
       x ${it.location.x.toFixed(3)} · y ${it.location.y.toFixed(3)}</div>
       <button class="ghost" id="locEdit">Change</button></div>`;
    $('locEdit').onclick = openPlan;
    drawThumb(it.location);
  } else {
    $('locBody').innerHTML = `<button class="ghost wide" id="locPick">Pick location on plan</button>`;
    $('locPick').onclick = openPlan;
  }

  /* audio clips */
  renderClips();
}

function renderClips(){
  const it = item();
  const clips = (it && it.audio_clips) || [];
  $('clips').innerHTML = clips.map(c => `
    <div class="clip">
      <span class="id">${c.clip_id}</span>
      <audio controls preload="none" src="${c.url}"></audio>
      <button data-id="${c.clip_id}" title="Delete recording">&times;</button>
    </div>`).join("");
  [...$('clips').querySelectorAll('button')].forEach(b => b.onclick = async () => {
    if (!confirm(`Delete recording ${b.dataset.id}?`)) return;
    await api(`/api/item/${item().item_id}/audio/${b.dataset.id}`, {method:"DELETE"});
    item().audio_clips = clips.filter(c => c.clip_id !== b.dataset.id);
    renderClips();
  });
}

async function drawThumb(loc){
  const c = $('locThumb'); if (!c) return;
  const ctx = c.getContext('2d');
  ctx.fillStyle = "#8884"; ctx.fillRect(0,0,76,76);
  ctx.fillStyle = "#e5484d";
  ctx.beginPath(); ctx.arc(loc.x*76, loc.y*76, 6, 0, 7); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
}

/* ---------------- mutations ---------------- */
async function patch(fields){
  const it = item(); if (!it) return;
  Object.assign(it, await api(`/api/item/${it.item_id}`, {
    method:"PATCH", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(fields)}));
  render();
}

async function newItem(){
  const it = await api('/api/item', {method:"POST"});
  items.push(it); ii = items.length - 1; pi = 0;
  render(); say(`Created ${it.item_id}`, "ok");
}

$('itemPrev').onclick = () => { if (ii>0){ ii--; pi=0; render(); } };
$('itemNext').onclick = () => { if (ii<items.length-1){ ii++; pi=0; render(); } };
$('photoPrev').onclick = () => { if (pi>0){ pi--; render(); } };
$('photoNext').onclick = () => { const it=item(); if (it && pi<it.photos.length-1){ pi++; render(); } };
$('btnNewItem').onclick = newItem;
$('btnAddPhoto').onclick = () => { if (item()) $('photoInput').click(); else say("Create an item first","bad"); };

$('photoInput').onchange = async e => {
  const f = e.target.files[0]; if (!f || !item()) return;
  e.target.value = "";
  const fd = new FormData(); fd.append("photo", f);
  say("Uploading photo…","warn");
  const ph = await api(`/api/item/${item().item_id}/photo`, {method:"POST", body:fd});
  item().photos.push(ph); pi = item().photos.length - 1;
  render(); say(`Added ${ph.photo_id}`,"ok");
};

$('btnDelPhoto').onclick = async () => {
  const it = item(), ph = photo(); if (!ph) return;
  if (!confirm(`Delete ${ph.photo_id}?`)) return;
  await api(`/api/item/${it.item_id}/photo/${ph.photo_id}`, {method:"DELETE"});
  it.photos.splice(pi,1); pi = Math.max(0, pi-1);
  render(); say("Photo deleted","ok");
};

$('include').onchange = e => patch({include: e.target.checked});
let dT; $('desc').oninput = () => { clearTimeout(dT); dT = setTimeout(()=>patch({description:$('desc').value}), 700); };
let tT; $('tags').oninput = () => { clearTimeout(tT); tT = setTimeout(()=>
  patch({tags: $('tags').value.split(",").map(s=>s.trim()).filter(Boolean)}), 700); };

/* ---------------- dictation (Web Speech API: free, no key) ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let sr = null, dictating = false, baseText = "";

if (!SR) {
  $('btnDictate').disabled = true;
  $('btnDictate').title = "This browser has no speech recognition";
}

$('btnDictate').onclick = () => {
  if (!item()) return say("Create an item first", "bad");
  if (!SR) { $('recMsg').className="msg bad";
    $('recMsg').textContent="No browser dictation here — use the mic key on your keyboard."; return; }

  if (dictating) { sr.stop(); return; }

  sr = new SR();
  sr.lang = "en-US";
  sr.continuous = true;
  sr.interimResults = true;

  baseText = $('desc').value;
  if (baseText && !baseText.endsWith(" ")) baseText += " ";

  sr.onstart = () => {
    dictating = true;
    $('btnDictate').textContent = "■ Stop dictating";
    $('recMsg').className = "msg warn";
    $('recMsg').textContent = "Listening — speak now.";
  };

  sr.onresult = e => {
    let finalTxt = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalTxt += t; else interim += t;
    }
    if (finalTxt) baseText += finalTxt + " ";
    // show committed text plus the live guess, but only persist the committed part
    $('desc').value = baseText + interim;
  };

  sr.onerror = ev => {
    $('recMsg').className = "msg bad";
    $('recMsg').textContent =
      ev.error === "not-allowed" ? "Microphone permission denied."
      : ev.error === "no-speech" ? "Didn't catch anything — try again."
      : ev.error === "network"   ? "Dictation needs a network connection."
      : "Dictation error: " + ev.error;
  };

  sr.onend = () => {
    dictating = false;
    $('btnDictate').innerHTML = "&#127908; Dictate";
    $('desc').value = baseText.trimEnd();
    patch({description: $('desc').value});
    if (!$('recMsg').classList.contains("bad")) {
      $('recMsg').className = "msg ok";
      $('recMsg').textContent = baseText.trim() ? "Dictation saved." : "Nothing captured.";
    }
  };

  try { sr.start(); }
  catch (err) { $('recMsg').className="msg bad"; $('recMsg').textContent = "Could not start: " + err.message; }
};

/* ---------------- audio recording (optional, needs OPENAI_API_KEY to transcribe) ---------------- */
let mr, chunks=[], rec=false;
$('btnRec').onclick = async () => {
  if (!item()) return say("Create an item first","bad");
  if (!rec){
    if (!navigator.mediaDevices?.getUserMedia)
      return $('recMsg').className="msg bad", $('recMsg').textContent="Mic needs HTTPS.";
    try{
      const s = await navigator.mediaDevices.getUserMedia({audio:true});
      mr = new MediaRecorder(s); chunks=[];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = async () => {
        s.getTracks().forEach(t=>t.stop());
        const blob = new Blob(chunks,{type:mr.mimeType});
        const wantText = $('txToggle').checked;
        const fd = new FormData();
        fd.append("audio", blob, "note.webm");
        fd.append("transcribe", wantText ? "true" : "false");
        $('recMsg').className="msg warn";
        $('recMsg').textContent = wantText ? "Uploading and transcribing…" : "Saving recording…";
        try{
          const r = await api(`/api/item/${item().item_id}/audio`, {method:"POST", body:fd});
          (item().audio_clips ||= []).push(r.clip);
          if (r.description){ item().description = r.description; $('desc').value = r.description; }
          renderClips();
          const kb = (r.clip.bytes/1024).toFixed(0);
          $('recMsg').className = "msg ok";
          $('recMsg').textContent = r.transcript
            ? `Saved ${r.clip.clip_id} (${kb} KB) and transcribed into the description.`
            : wantText
              ? `Saved ${r.clip.clip_id} (${kb} KB). No transcript — no API key set; use Dictate for text.`
              : `Saved ${r.clip.clip_id} (${kb} KB). Audio kept, not transcribed.`;
        }catch(err){ $('recMsg').className="msg bad"; $('recMsg').textContent=err.message; }
      };
      mr.start(); rec=true; $('btnRec').textContent="■ Stop";
      $('recMsg').className="msg warn"; $('recMsg').textContent="Recording…";
    }catch(err){
      $('recMsg').className="msg bad";
      $('recMsg').textContent = err.name==="NotAllowedError" ? "Mic permission denied." : err.name;
    }
  } else { mr.stop(); rec=false; $('btnRec').textContent="● Record"; }
};

/* ---------------- plans ---------------- */
$('btnPlans').onclick = () => $('planInput').click();
$('planInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = "";
  const fd = new FormData(); fd.append("plan", f);
  say("Uploading plan…","warn");
  const p = await api('/api/plan',{method:"POST", body:fd});
  plans.push(p); say(`Plan “${p.name}” uploaded`,"ok");
};

async function openPlan(){
  if (!plans.length) return say("Upload a plan first — tap “Plans”.","bad");
  $('planSelect').innerHTML = plans.map(p =>
    `<option value="${p.plan_id}">${p.name} (${p.pages} page${p.pages===1?"":"s"})</option>`).join("");
  const it = item();
  pendingLoc = it.location ? {...it.location} : null;
  if (pendingLoc) $('planSelect').value = pendingLoc.plan_id;
  $('planDlg').showModal();
  await drawPlan();
}
$('planSelect').onchange = () => { pendingLoc = null; $('planPin').hidden = true; drawPlan(); };

async function drawPlan(){
  const p = plans.find(x => x.plan_id === $('planSelect').value);
  const cv = $('planCanvas'), ctx = cv.getContext('2d');
  $('planMsg').textContent = "Loading plan…";
  try{
    const url = p.url;
    if ((p.name||"").toLowerCase().endsWith(".pdf")){
      const buf = await (await fetch(url)).arrayBuffer();
      planDoc = await pdfjsLib.getDocument({data:buf}).promise;
      const page = await planDoc.getPage(pendingLoc?.page || 1);
      const vp = page.getViewport({scale:2});
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext:ctx, viewport:vp}).promise;
    } else {
      const img = new Image();
      await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url;});
      cv.width = img.width; cv.height = img.height; ctx.drawImage(img,0,0);
    }
    $('planMsg').textContent = "Tap to place the marker.";
    if (pendingLoc) showPin(pendingLoc.x, pendingLoc.y);
  }catch(err){ $('planMsg').textContent = "Could not render plan: " + err.message; }
}

function showPin(x,y){
  const pin = $('planPin');
  pin.style.left = (x*100)+"%"; pin.style.top = (y*100)+"%"; pin.hidden = false;
}
$('planCanvas').onclick = e => {
  const r = $('planCanvas').getBoundingClientRect();
  // normalised 0-1: survives any screen size, zoom, or re-render
  const x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
  pendingLoc = {plan_id:$('planSelect').value, page: pendingLoc?.page || 1, x, y};
  showPin(x,y);
  $('planMsg').textContent = `x ${x.toFixed(3)} · y ${y.toFixed(3)}`;
};
$('planClear').onclick = () => { pendingLoc = null; $('planPin').hidden = true;
  $('planMsg').textContent = "Marker cleared."; };
$('planDone').onclick = async () => { $('planDlg').close(); await patch({location: pendingLoc}); };

/* ---------------- report template (formatting only) ---------------- */
let template = null;

async function loadTemplate(){
  try{ const r = await api('/api/template'); template = r.template || null; }
  catch(e){ template = null; }
  renderTemplate();
}

function renderTemplate(){
  if (!template){
    $('tplBar').innerHTML = "";
    return;
  }
  const n = (template.styles || []).length;
  $('tplBar').innerHTML =
    `<span>&#128196;</span><b>${esc(template.name)}</b>
     <span>&middot; ${n} style${n===1?"":"s"} &middot; report will match it</span>
     <button class="x" id="tplDel" title="Remove template">&times;</button>`;
  $('tplDel').onclick = async () => {
    if (!confirm("Remove the report template?\nExports go back to the plain format.")) return;
    await api('/api/template', {method:"DELETE"});
    template = null; renderTemplate(); say("Template removed.","ok");
  };
}
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('btnTemplate').onclick = () => $('tplInput').click();
$('tplInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = "";
  const fd = new FormData(); fd.append("template", f);
  say("Uploading template…","warn");
  try{
    const r = await api('/api/template', {method:"POST", body:fd});
    template = r.template || r; renderTemplate();
    say(`Template set — the report will use “${template.name}” formatting.`,"ok");
  }catch(err){ say(err.message,"bad"); }
};

$('btnExport').onclick = () => {
  if (!items.some(x=>x.include)) return say("No items are included in the report.","bad");
  location.href = "/api/export/docx";
};

load().catch(e => say(e.message, "bad"));
</script>
