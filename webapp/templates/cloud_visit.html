<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16181D"><title>Item capture - MKA Site Visit Buddy</title><link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/app-icon.svg"><link rel="apple-touch-icon" href="/static/app-icon.svg"><link rel="stylesheet" href="/static/cloud_mobile.css"><link rel="stylesheet" href="/static/cloud_mobile_components.css"></head><body><main class="app">
<header class="topbar"><a class="icon-button" id="back" href="/visits/{{ visit_id }}/overview" aria-label="Visit overview"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a><div><div class="project-title" id="project-name">[Project name]</div><div class="eyebrow" id="visit-date">Site visit &middot; [Date]</div></div><div class="top-actions"><button class="icon-button" id="plans" aria-label="Plans"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15M15 6v15"/></svg></button><button class="icon-button" id="more" aria-label="More options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div></header>
<section class="stepper"><button class="icon-button" id="previous" aria-label="Previous item"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="step-copy"><div class="item-number" id="item-number">--</div><div class="step-meta" id="item-total">of -- items</div></div><button class="icon-button" id="next" aria-label="Next item"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></section>
<section><h2 class="section-label">Photos</h2><div class="photo-panel" id="photo-panel"><div class="photo-empty"><svg viewBox="0 0 24 24"><path d="M4 7h4l2-2h4l2 2h4v12H4Z"/><circle cx="12" cy="13" r="3"/></svg><strong>No photos yet</strong><div class="photo-actions"><button class="pill primary" id="camera">Camera</button><button class="pill" id="library">Library</button></div></div></div><input class="sr-only" id="camera-input" type="file" accept="image/*" capture="environment"><input class="sr-only" id="library-input" type="file" accept="image/*" multiple></section>
<section class="section card settings"><div class="setting-row"><div class="setting-copy"><div class="setting-title">Include in report</div><div class="setting-hint" id="include-hint">Will appear in the Word report</div></div><button class="toggle" id="include" role="switch" aria-checked="true" aria-label="Include in report"></button></div><button class="setting-row" id="location"><span class="setting-icon"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-12a6 6 0 1 0-12 0c0 6.8 6 12 6 12Z"/><circle cx="12" cy="9" r="2"/></svg></span><span class="setting-copy"><span class="setting-title">Location on plan</span><span class="setting-hint" id="location-hint">Optional &middot; tap to drop a pin</span></span><span class="chevron">&rsaquo;</span></button></section>
<section class="section"><h2 class="section-label">Description</h2><div class="card description-card"><textarea id="description" placeholder="What did you observe?"></textarea><div class="description-tools"><label class="check-label"><input id="transcribe" type="checkbox">Transcribe audio</label><button class="icon-button" id="dictate" aria-label="Dictate"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button><button class="icon-button" id="record" aria-label="Record audio"><span class="record-dot"></span></button></div></div></section>
<section class="section"><h2 class="section-label">Importance</h2><div class="segmented" id="importance"><button data-value="Low"><i class="importance-dot"></i>Low</button><button data-value="Med"><i class="importance-dot med"></i>Med</button><button data-value="High"><i class="importance-dot high"></i>High</button><button data-value="Critical"><i class="importance-dot critical"></i>Critical</button></div></section>
<section class="section"><h2 class="section-label">Tags</h2><div class="card tag-card" id="tags"><input class="tag-input" id="tag-input" placeholder="Add tag" aria-label="Add tag"></div></section><button class="text-button delete" id="delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg>Delete item</button><p class="status" id="message" role="status"></p></main>
<nav class="bottom-bar"><button class="pill primary" id="new-item">+ New item</button><button class="pill secondary" id="export">Export</button></nav><script>window.VISIT_ID={{ visit_id|tojson }};</script><script src="/static/offline.js"></script><script src="/static/cloud_pwa.js"></script><script src="/static/cloud_capture.js"></script><script src="/static/cloud_capture_media.js"></script></body></html>
