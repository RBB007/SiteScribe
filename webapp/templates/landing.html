<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1017" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MKA Site-to-Report">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/app-icon.svg">
<link rel="stylesheet" href="https://use.typekit.net/kzv5htm.css">
<title>MKA Site-to-Report</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f7f7;--fg:#222;--mut:#666;--line:#d9dce2;--card:#fff;--card2:#ededed;
  --accent:#4a597c;--accent-fg:#fff;--brand:#aaba0a;--brand-dark:#919f09;
  --ok:#919f09;--bad:#cc2e2e;--warn:#4a597c;
  --shadow:0 1px 2px rgba(22,28,43,.05),0 10px 28px rgba(22,28,43,.07);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#101521;--fg:#fff;--mut:#b9bfcb;--line:#303a50;--card:#161c2b;--card2:#1d2a48;
  --accent:#738bc1;--accent-fg:#fff;--brand:#aaba0a;--brand-dark:#aaba0a;
  --ok:#aaba0a;--bad:#ff8585;--warn:#b8c7e9;
  --shadow:0 1px 2px rgba(0,0,0,.16),0 10px 28px rgba(0,0,0,.18);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 "futura-pt",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:600px;margin:0 auto}
header{padding:calc(28px + env(safe-area-inset-top)) 2px 22px;display:flex;align-items:center;gap:14px}
.mark{width:62px;height:54px;display:grid;place-items:center;border-radius:0;color:#fff;
  background:var(--accent);border-bottom:5px solid var(--brand);box-shadow:0 9px 22px rgba(22,28,43,.18);
  font-size:21px;font-weight:700;letter-spacing:.06em}
.brand{min-width:0}
h1{margin:0;font-size:27px;line-height:1.1;letter-spacing:-.025em}h1 span{color:var(--accent)}
.tag{color:var(--mut);font-size:13px;margin-top:4px;line-height:1.35}
button{font:inherit;min-height:44px;border:0;border-radius:0;background:var(--accent);
  color:var(--accent-fg);padding:13px 16px;font-weight:650;cursor:pointer;touch-action:manipulation;
  transition:transform .12s ease,filter .12s ease}
button:active{transform:scale(.98);filter:brightness(.96)}button:disabled{opacity:.45}
button.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
button.wide{width:100%}
.sec{margin-top:24px}
.sec h2{font-size:12px;letter-spacing:.075em;text-transform:uppercase;color:var(--mut);
  font-weight:750;margin:0 4px 10px}
.new{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);
  border-radius:0;padding:16px;box-shadow:var(--shadow);border-top:5px solid var(--brand)}
input[type=text]{width:100%;padding:14px;border:1px solid var(--line);border-radius:0;
  background:var(--card2);color:var(--fg);font:inherit;font-size:16px;margin-bottom:10px;outline:none}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.hint{font-size:12.5px;color:var(--mut);margin-top:9px}
.proj{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:0;
  padding:14px;margin-bottom:10px;cursor:pointer;color:var(--fg);box-shadow:var(--shadow)}
.proj:active{transform:scale(.99)}
.proj .main{flex:1;min-width:0}
.proj .nm{font-weight:700;font-size:15.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .meta{color:var(--mut);font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.proj .cur{display:inline-block;background:var(--brand);color:#161c2b;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:0;margin-left:7px;vertical-align:1px;letter-spacing:.04em}
.proj .go{color:var(--accent);font-size:25px;flex:0 0 auto}
.kebab{flex:0 0 auto;background:transparent;border:0;color:var(--mut);
  font-size:18px;min-height:40px;padding:6px 8px;border-radius:0;cursor:pointer}
.kebab:hover{background:var(--card2);color:var(--fg)}
.empty{text-align:center;color:var(--mut);padding:26px 16px;background:var(--card);
  border:1px dashed var(--line);border-radius:0;font-size:14px}
.msg{font-size:13px;margin-top:12px;min-height:18px;text-align:center}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:26px 0 8px}
footer a{color:var(--mut)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .new{background:linear-gradient(145deg,#151e29,#121922)}}
@media(max-width:430px){.proj{gap:7px}.proj .meta{font-size:11.5px}.kebab{padding:6px}.tag{max-width:300px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="mark" aria-hidden="true">MKA</div>
  <div class="brand"><h1>MKA <span>Site-to-Report</span></h1>
  <div class="tag">Field observations to finished reports.</div></div>
</header>

<div class="sec">
  <h2>Start a new report</h2>
  <div class="new">
    <input type="text" id="name" maxlength="120" autocomplete="off"
           placeholder="Project name (e.g. Oakland Mixed-Use — Roof Framing)">
    <button class="wide" id="create">Create report</button>
    <div class="hint" id="autoHint"></div>
  </div>
</div>

<div class="sec">
  <h2>Open an existing report</h2>
  <div id="list"></div>
</div>

<div class="msg" id="msg"></div>

<footer><a href="https://www.mka.com/" target="_blank" rel="noopener">Magnusson Klemencic Associates</a> · <a href="/logout">Sign out</a></footer>
</div>

<script>
const $ = id => document.getElementById(id);
let projects = [], current = null;

async function api(path, opts={}){
  const res = await fetch(path, opts);
  if (res.status === 401){ location.href = "/login"; throw new Error("unauthorized"); }
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}
const say = (t, c="") => { $('msg').className = "msg " + c; $('msg').textContent = t; };

function stamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function updateHint(){
  $('autoHint').textContent = $('name').value.trim()
    ? " "
    : `Leave blank and it will be named “Site Visit ${stamp()}”.`;
}
$('name').oninput = updateHint;

function ago(iso){
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s/60)} min ago`;
  if (s < 86400) return `${Math.floor(s/3600)} hr ago`;
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " +
         d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}

function render(){
  if (!projects.length){
    $('list').innerHTML =
      `<div class="empty">No reports yet.<br>Create one above to start capturing.</div>`;
    return;
  }
  $('list').innerHTML = projects.map(p => `
    <div class="proj" data-id="${p.project_id}">
      <div class="main">
        <div class="nm">${esc(p.name)}${p.project_id===current?'<span class="cur">OPEN</span>':''}</div>
        <div class="meta">${p.items} item${p.items===1?"":"s"} ·
          ${p.photos} photo${p.photos===1?"":"s"} ·
          ${p.included} in report · ${ago(p.updated)}</div>
      </div>
      <button class="kebab" data-act="rename" title="Rename">&#9998;</button>
      <button class="kebab" data-act="delete" title="Delete">&#128465;</button>
      <span class="go">&rsaquo;</span>
    </div>`).join("");

  [...$('list').querySelectorAll('.proj')].forEach(row => {
    const id = row.dataset.id;
    row.onclick = e => {
      const act = e.target.closest('button')?.dataset.act;
      if (act === "rename") return rename(id);
      if (act === "delete") return del(id);
      open_(id);
    };
  });
}
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){
  const d = await api('/api/projects');
  projects = d.projects; current = d.current;
  render(); updateHint();
}

$('create').onclick = async () => {
  const name = $('name').value.trim();
  $('create').disabled = true; say("Creating…","warn");
  try{
    const p = await api('/api/projects', {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({name})});
    location.href = "/overview";
  }catch(err){ say(err.message,"bad"); $('create').disabled = false; }
};
$('name').addEventListener('keydown', e => { if (e.key === "Enter") $('create').click(); });

async function open_(id){
  say("Opening…","warn");
  try{ await api(`/api/projects/${id}/open`, {method:"POST"}); location.href = "/overview"; }
  catch(err){ say(err.message,"bad"); }
}

async function rename(id){
  const p = projects.find(x => x.project_id === id);
  const name = prompt("Rename report:", p.name);
  if (name === null || !name.trim()) return;
  try{
    await api(`/api/projects/${id}`, {method:"PATCH",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({name: name.trim()})});
    await load(); say("Renamed.","ok");
  }catch(err){ say(err.message,"bad"); }
}

async function del(id){
  const p = projects.find(x => x.project_id === id);
  if (!confirm(`Delete “${p.name}”?\n\n${p.items} item(s) and ${p.photos} photo(s) will be permanently removed. This cannot be undone.`)) return;
  try{
    await api(`/api/projects/${id}`, {method:"DELETE"});
    await load(); say("Deleted.","ok");
  }catch(err){ say(err.message,"bad"); }
}

load().catch(e => say(e.message,"bad"));
if ("serviceWorker" in navigator) window.addEventListener("load", () =>
  navigator.serviceWorker.register("/service-worker.js").catch(() => {}));
</script>
</body>
</html>
